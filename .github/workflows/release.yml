# Releases go out every day at 7:00 AM Chicago time, on their own.
#
# How it works: commit and push to main whenever. Each morning this checks the top of
# CHANGELOG.md. If it's a dated version ("## 0.9.24 (2026-10-13)", not "(unreleased)") and
# there's no v0.9.24 tag yet, it tags the commit, builds the zip, attaches it to a GitHub
# release, and uploads it to CurseForge and Wago with that changelog section.
# Nothing new to ship: it does nothing.
#
# Need it out now instead? Push a tag like v0.9.24 yourself, or press "Run workflow" on
# the Actions tab (Release). Both skip the 7 AM wait.
name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    # GitHub runs schedules in UTC. 7:00 AM in Chicago is 12:00 UTC in daylight time and
    # 13:00 UTC in standard time, so both are listed and the wrong one stops itself below.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything to release?
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Tag pushed by hand: releasing ${GITHUB_REF_NAME} now."
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # which of the two crons fired, and is it the one that is 7 AM in Chicago today
            offset=$(TZ=America/Chicago date +%z)
            if [ "${{ github.event.schedule }}" = "0 12 * * *" ] && [ "$offset" != "-0500" ]; then
              echo "Standard time: the 13:00 UTC run handles 7 AM. Skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "${{ github.event.schedule }}" = "0 13 * * *" ] && [ "$offset" != "-0600" ]; then
              echo "Daylight time: the 12:00 UTC run handles 7 AM. Skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          head=$(grep -m1 -E '^## ' CHANGELOG.md || true)
          ver=$(echo "$head" | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?) \([0-9]{4}-[0-9]{2}-[0-9]{2}\).*/\1/p')
          if [ -z "$ver" ]; then
            echo "Top of CHANGELOG.md isn't a dated release (\"$head\"). Nothing to ship."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver is already released. Nothing to ship."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # every TOC must carry the same version, or the build would mislabel itself
          bad=$(grep -L "^## Version: $ver\s*$" ForeverArtisan_*/*.toc || true)
          if [ -n "$bad" ]; then
            echo "::error::These TOCs aren't at $ver (run tools/release.py first): $bad"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$ver"
          git push origin "v$ver"
          echo "Tagged v$ver. Releasing."
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Package and upload
        if: steps.decide.outputs.go == 'true'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      # Posts "ForeverArtisan 0.9.24 is out" and that version's changelog bullets to Discord.
      # Needs a repo secret DISCORD_WEBHOOK (Discord: channel settings > Integrations > Webhooks).
      # No secret set: this step does nothing.
      - name: Post the changes to Discord
        if: steps.decide.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VER: ${{ steps.decide.outputs.ver }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then echo "No DISCORD_WEBHOOK secret, skipping."; exit 0; fi
          python3 - <<'PY'
          import json, os, re, urllib.request
          ver = os.environ["VER"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(ver) + r"\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "").strip()
          head = "**ForeverArtisan %s is out**\n\n" % ver
          tail = "\n\nUpdate in the CurseForge app or from https://www.curseforge.com/wow/addons/foreverartisan, then /reload."
          room = 2000 - len(head) - len(tail) - 40
          if len(body) > room:
              body = body[:room].rsplit("\n", 1)[0] + "\n(full list on CurseForge)"
          msg = {"content": head + body + tail, "allowed_mentions": {"parse": []}, "flags": 4}
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], data=json.dumps(msg).encode(),
                                       headers={"Content-Type": "application/json", "User-Agent": "ForeverArtisan-release"})
          urllib.request.urlopen(req).read()
          print("Posted to Discord:", ver)
          PY

